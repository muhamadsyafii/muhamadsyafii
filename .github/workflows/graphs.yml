name: generate arcade contribution graphs

on:
  schedule: # Run automatically every 24 hours
    - cron: "0 0 * * *"
  workflow_dispatch: # Allows manual triggering
  push: # Runs on every push to the default branch
    branches:
      - master

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: generate contribution graph SVGs
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          # Comma-separated list of game names to generate. Default: pacman
          games: "pacman,breakout,galaga,puzzle-bobble,bomberman,minesweeper,snake,tetris"
          # Optional: omit the month labels row above the grid. Default: false
          hide_month_labels: "false"

      - name: match Galaga background with GitHub Dark
        run: |
          sed -i 's/#000000/#0D1117/g' \
            dist/galaga-contribution-graph-dark.svg

      - name: create Galaga profile header
        run: |
          cp dist/galaga-contribution-graph-dark.svg \
            dist/galaga-header-dark.svg
          sed -i 's|</svg>|<rect x="308" y="72" width="550" height="120" rx="24" fill="#0D1117" fill-opacity="0.82" stroke="#1E1B4B" stroke-width="2"/><text x="583" y="122" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="700" fill="#F8FAFC">Muhamad Syafii</text><text x="583" y="157" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#F8FAFC">To Infinity and Beyond 🚀</text></svg>|' \
            dist/galaga-header-dark.svg

      # Push the generated SVGs to the output branch
      - name: push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v5.0.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
